name = "choyxona-scheduler"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Cron triggers — har daqiqada ishlaydi (HH:MM aniqligi uchun)
# Cloudflare free planda har daqiqada cron qo'llanadi
[triggers]
crons = ["* * * * *"]

# Secrets'ni dashboard yoki `wrangler secret put` orqali kiritiladi:
#   SUPABASE_URL          - https://xxx.supabase.co
#   SUPABASE_SERVICE_KEY  - service_role kalit (Settings → API → "service_role")
#   OPENWEATHER_KEY       - https://openweathermap.org/api kalit (free tier)

# Bilib qo'ying: SUPABASE_SERVICE_KEY admin kalit, hech kimga bermang!
